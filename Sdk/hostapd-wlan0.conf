interface=wlan0
bridge=tether
driver=nl80211
ctrl_interface=/var/run/hostapd
ctrl_interface_group=0

ssid=ArixoLink-2.4G
hw_mode=g
channel=0

#ieee80211d=1
#ieee80211h=1
country_code=CN

ieee80211n=1
ht_capab=[HT40-][HT40+][SHORT-GI-20][SHORT-GI-40][TX-STBC][LSIG-TXOP-PROT][DSSS_CCK-40]

ieee80211ax=1

wmm_enabled=1

he_bss_color=15
he_su_beamformer=1
he_su_beamformee=1
he_mu_beamformer=1
he_default_pe_duration=4
he_twt_required=1
he_rts_threshold=16

