[package]
name = "modem-license"
version = "0.2.6"
edition = "2021"
description = "Shared license verification library for Modem Cat"

[dependencies]
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
mac_address = "1.1"

[dev-dependencies]
rand = "0.8"
