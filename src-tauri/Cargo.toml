[package]
name = "modem-cat"
version = "0.1.2"
description = "5G Modem调试工具"
authors = ["modem-cat"]
edition = "2021"

[lib]
name = "modem_cat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "modem-cat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
serialport = "4"
log = "0.4"
env_logger = "0.11"
modem-hal = { path = "../modem-hal" }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
