[package]
name = "license-gen"
version = "0.1.0"
edition = "2021"
description = "License Generator for Modem Cat"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
modem-license = { path = "../../../modem-license" }
ring = "0.17"
mac_address = "1.1"
# ring needs getrandom with std feature for SystemRandom
getrandom = { version = "0.2", features = ["std"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "license_gen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "license-gen"
path = "src/main.rs"
